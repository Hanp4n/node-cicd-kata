name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14.x

      - name: Test lint
        run: npm run lint

      - name: Test format
        run: npm run format:check

      - name: Test types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test